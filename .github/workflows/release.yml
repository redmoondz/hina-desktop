name: Release Hina Desktop

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  build:
    needs: validate
    uses: ./.github/workflows/build-and-notarize.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(artifacts/windows-build/*.exe)
          blockmaps=(artifacts/windows-build/*.exe.blockmap)
          linux_appimage=(artifacts/linux-build/*.AppImage)
          linux_deb=(artifacts/linux-build/*.deb)
          linux_rpm=(artifacts/linux-build/*.rpm)
          linux_tar=(artifacts/linux-build/*.tar.gz)
          test "${#windows[@]}" = 1
          test "${#blockmaps[@]}" = 1
          test -f artifacts/windows-build/latest.yml
          test "${#linux_appimage[@]}" = 1
          test "${#linux_deb[@]}" = 1
          test "${#linux_rpm[@]}" = 1
          test "${#linux_tar[@]}" = 1
          test -f artifacts/linux-build/latest-linux.yml
          for arch in arm64 x64; do
            dmg=(artifacts/macos-$arch-build/*.dmg)
            zip=(artifacts/macos-$arch-build/*.zip)
            test "${#dmg[@]}" = 1
            test "${#zip[@]}" = 1
            test -f "artifacts/macos-$arch-build/latest-$arch-mac.yml"
          done
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            artifacts/windows-build/*.exe
            artifacts/windows-build/*.exe.blockmap
            artifacts/windows-build/latest.yml
            artifacts/linux-build/*.AppImage
            artifacts/linux-build/*.deb
            artifacts/linux-build/*.rpm
            artifacts/linux-build/*.tar.gz
            artifacts/linux-build/latest-linux.yml
            artifacts/macos-*-build/*.dmg
            artifacts/macos-*-build/*.zip
            artifacts/macos-*-build/*.blockmap
            artifacts/macos-*-build/latest-*-mac.yml
          )
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --title "Hina Desktop ${RELEASE_TAG#v}" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false
