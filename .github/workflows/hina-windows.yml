name: Hina Desktop Windows
on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create a draft release containing the installer and update metadata
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: version
        name: Read package version
        shell: bash
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify local XTTS runtime and worker
        run: |
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r resources/xtts/requirements.txt
          python resources/xtts/test_worker.py
          python -c "from TTS.tts.configs.xtts_config import XttsConfig; from TTS.tts.models.xtts import Xtts; Xtts(XttsConfig()); print('XTTS architecture initialized')"
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
      - run: npm ci
      - run: npm run quality-check
      - run: node --test test/helpers/windowsUpdateAssets.test.js
      - run: node --import tsx --test test/helpers/hinaXtts.test.js test/helpers/hinaXttsSettings.test.js test/helpers/hinaSpeechPlayback.test.js test/helpers/hinaSpeech.test.js test/helpers/hinaConnector.test.js test/helpers/hinaPortableSettings.test.js test/helpers/audioManagerPendingStart.test.js test/helpers/useAudioRecordingPreparationStop.test.js test/helpers/windowsKeyPressLifecycle.test.js test/helpers/hotkeyModifierOnlyNative.test.js test/helpers/windowManagerAssistantPanel.test.js test/helpers/mediaPlayer.test.js test/components/hinaSettingsPanels.test.js test/components/hinaRendererSurface.test.js test/services/hinaVoiceAssistant.test.js test/helpers/dictationAgentInference.test.js test/helpers/secretKeys.test.js test/services/lanReasoningOutput.test.js test/components/fieldDirectionPolicy.test.js test/helpers/updater.test.js test/helpers/trayQuickActions.test.js
      - run: node --import tsx --test --test-concurrency=2 test/helpers/audioManagerWindowsGain.test.js test/helpers/audioManagerVoiceTranscript.test.js test/helpers/localSpeechGate.test.js test/helpers/assistantTextInput.test.js test/helpers/hinaSessionSurface.test.js test/helpers/hinaSessionsHook.test.js test/helpers/assistantPanel.test.js test/helpers/microphoneGain.test.js test/helpers/microphoneProcessing.test.js test/helpers/settingsStoreMicrophoneGain.test.js test/components/microphoneTest.test.js
      - run: npm run prebuild:win
      - run: npx electron-rebuild --force --which-module better-sqlite3
      - name: Build Windows installer and updater metadata
        run: npm run build:renderer && npx electron-builder --win nsis --x64 --config electron-builder.unsigned-win.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify update assets
        run: node scripts/verify-windows-update-assets.cjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: Hina-Desktop-Windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
  draft-release:
    if: inputs.create_draft_release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hina-Desktop-Windows-installer
          path: release-assets
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" release-assets/* --draft "${release_flags[@]}" --target "$RELEASE_COMMIT" --title "Hina Desktop $RELEASE_VERSION" --notes "Windows installer with in-app updates. Review the installer and metadata, then publish this draft to make the update available."
